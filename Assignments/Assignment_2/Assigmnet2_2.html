<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
</head>

<body>
    <h1>Course Registration</h1>
    <label for="course">Enter a course name:</label>
    <input type="text" id="course">
    <button id="register-button">Register</button>
    <p id="message"></p>
    <script>
        // Write your JavaScript here
        let messageIn = document.getElementById("message");
        let courseIn = document.getElementById("course");

        function registerCourse() {
          let info = document.getElementById("course").value;
          if(info.trim() !== "")
          {
            messageIn.textContent = `You are registered for Course: ${info}`;
          }
          else
          {
             messageIn.textContent= "Please enter a course name";
          }
          courseIn.value = "";

        };
            document.getElementById("register-button").addEventListener("click", registerCourse);
    </script>
</body>
</html>
