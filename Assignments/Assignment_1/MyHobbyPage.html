<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Page</title>

    <style>
        .hobby-table {
        border: 1px solid black;
        width: 50%;
        border-collapse: collapse;
        }

        .hobby-table th {
        border: 1px solid black;
        padding: 8px;
        }

        .hobby-table td {
        border: 1px solid black;
        padding: 8px;
        }

        .h-spent {
        text-align: center;
        }
    </style>
</head>

<body>
    <h1>My Hobby Page</h1>
    <p>
        I enjoy spending my free time doing different activities that make me happy.
    </p>
    <img src="../../Images/hobby.jpg" alt="Hobby Image">

    <p>Hobbies</p>
    <ul>
        <li>Reading</li>
        <li>Painting</li>
        <li>Travel</li>
    </ul><hr>

    <table class="hobby-table">
        <tr>
            <th>Hobby</th>
            <th>Time Spent per Week (hours)</th>
        </tr>
        <tr>
            <td>Gaming</td>
            <td class="h-spent">24</td>
        </tr>
        <tr>
            <td>Studying</td>
            <td class="h-spent">40</td>
        </tr>
        <tr>
            <td>Cooking</td>
            <td class="h-spent">5</td>
        </tr>
    </table>

    <P>Hobby Link:
    <a href="https://www.dndbeyond.com/en">Learn more about hobbies</a>
    </P>
</body>
</html>
